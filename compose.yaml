services:
  postgres:
    image: postgres:17
    container_name: questbackend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quest_backend}
      POSTGRES_USER: ${POSTGRES_USER:-quest_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quest_backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quest_backend} -d ${POSTGRES_DB:-quest_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
